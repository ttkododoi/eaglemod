# docker-compose.base44.yml
# Development setup for the GX Launcher modded web app.
# Static HTML/CSS/JS served by nginx from a bind-mount of the repo source.
# Edits to static files are served immediately (no build step).

services:
  web:
    image: nginx:alpine
    restart: on-failure
    ports:
      - "3000:3000"
    volumes:
      # Bind-mount the repo source so edits are served live
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
